<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Painel ADM - Rifa do Guerreiro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .admin-header {
            background: rgba(20, 0, 0, 0.9);
            border: 3px solid #ff0000;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .admin-title {
            color: #ff4444;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        .live-badge {
            background: #ff0000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; background: #ff0000; }
            50% { opacity: 0.7; background: #cc0000; }
        }
        .back-btn {
            background: linear-gradient(135deg, #333, #111);
            color: #ff4444;
            border: 2px solid #ff0000;
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .admin-stat {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ff4444;
        }
        .admin-stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff4444;
        }
        .admin-stat-label { color: #ccc; font-size: 0.9rem; }
        .admin-panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .admin-panel {
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 25px;
        }
        .panel-title {
            color: #ff4444;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .number-control {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .number-input {
            flex: 1;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #ff4444;
            border-radius: 8px;
            color: white;
        }
        .action-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #ff0000, #ff4444);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .action-btn.green { background: linear-gradient(135deg, #006400, #228B22); }
        .action-btn.red { background: linear-gradient(135deg, #8B0000, #B22222); }
        .action-btn.blue { background: linear-gradient(135deg, #00008B, #191970); }
        .action-btn.orange { background: linear-gradient(135deg, #ff8800, #ff5500); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-card {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff4444;
            margin-bottom: 20px;
        }
        .pending-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .pending-item {
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pending-number { font-size: 1.3rem; font-weight: bold; color: #ff4444; }
        .pending-user { color: #ccc; font-size: 0.9rem; }
        .table-btn {
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin: 0 3px;
        }
        .confirm-btn { background: rgba(0,255,0,0.1); color: #00ff00; border: 1px solid #00ff00; }
        .cancel-btn { background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid #ff4444; }
        .numbers-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .numbers-table th {
            background: rgba(255,0,0,0.2);
            padding: 10px;
            text-align: left;
        }
        .numbers-table td {
            padding: 8px;
            border-bottom: 1px solid #333;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-available { background: rgba(0,255,0,0.1); color: #00ff00; border: 1px solid #00ff00; }
        .status-pending { background: rgba(255,165,0,0.1); color: #ffa500; border: 1px solid #ffa500; }
        .status-confirmed { background: rgba(0,0,255,0.1); color: #4169E1; border: 1px solid #4169E1; }
        .status-sold { background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid #ff4444; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            border: 2px solid #ff0000;
            border-radius: 10px;
            padding: 15px;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .admin-panels { grid-template-columns: 1fr; }
            .numbers-table { font-size: 0.7rem; }
            .numbers-table th, .numbers-table td { padding: 4px; }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="container">
        <div class="admin-header">
            <div class="header-top">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <h1 class="admin-title"><i class="fas fa-user-shield"></i> PAINEL ADM</h1>
                    <div class="live-badge"><i class="fas fa-circle"></i> LIVE SYNC</div>
                </div>
                <a href="rifa.html" class="back-btn"><i class="fas fa-arrow-left"></i> VOLTAR</a>
            </div>
            <div class="admin-stats">
                <div class="admin-stat"><div class="admin-stat-label">TOTAL</div><div class="admin-stat-value" id="totalNumbers">31</div></div>
                <div class="admin-stat"><div class="admin-stat-label">VENDIDOS</div><div class="admin-stat-value" id="confirmedNumbers">0</div></div>
                <div class="admin-stat"><div class="admin-stat-label">PENDENTES</div><div class="admin-stat-value" id="pendingNumbers">0</div></div>
                <div class="admin-stat"><div class="admin-stat-label">ARRECADAÇÃO</div><div class="admin-stat-value" id="totalAmount">R$ 0</div></div>
            </div>
        </div>
        
        <div class="admin-panels">
            <div class="admin-panel">
                <h3 class="panel-title"><i class="fas fa-gamepad"></i> CONTROLE DE NÚMEROS</h3>
                <div class="number-control">
                    <input type="number" id="controlNumber" class="number-input" placeholder="Número (1-31)" min="1" max="31">
                    <button class="action-btn" id="checkNumberBtn"><i class="fas fa-search"></i> VERIFICAR</button>
                </div>
                <div id="numberInfo" style="display: none;">
                    <div class="info-card">
                        <h4>NÚMERO <span id="infoNumber">0</span></h4>
                        <p><strong>Guerreiro:</strong> <span id="infoWarrior">-</span></p>
                        <p><strong>Status:</strong> <span id="infoStatus">-</span></p>
                        <p><strong>Comprador:</strong> <span id="infoBuyer">-</span></p>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: repeat(2,1fr); gap:10px;">
                    <button class="action-btn green" id="confirmNumberBtn" disabled><i class="fas fa-check"></i> CONFIRMAR</button>
                    <button class="action-btn red" id="cancelNumberBtn" disabled><i class="fas fa-times"></i> CANCELAR</button>
                    <button class="action-btn orange" id="forceSelectBtn"><i class="fas fa-user-plus"></i> FORÇAR VENDA</button>
                </div>
            </div>
            
            <div class="admin-panel">
                <h3 class="panel-title"><i class="fas fa-clock"></i> PENDENTES</h3>
                <div class="pending-list" id="pendingList"></div>
            </div>
        </div>
        
        <div class="admin-panel">
            <h3 class="panel-title"><i class="fas fa-list-ol"></i> TABELA COMPLETA</h3>
            <div style="overflow-x: auto;">
                <table class="numbers-table">
                    <thead><tr><th>Nº</th><th>Guerreiro</th><th>Status</th><th>Comprador</th></tr></thead>
                    <tbody id="numbersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB8E7-9j-34IFkbsioAcqH0_Zo0wc5aeYE",
            authDomain: "furiadanoiteplay.firebaseapp.com",
            projectId: "furiadanoiteplay",
            storageBucket: "furiadanoiteplay.firebasestorage.app",
            messagingSenderId: "915495554416",
            appId: "1:915495554416:web:756ab51a83cbd8a2e953b5",
            databaseURL: "https://furiadanoiteplay-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dbRef = database.ref('rifaGuerreiro');
        
        const warriorNames = [
            "Alucard","Miya","Zilong","Layla","Chou","Gusion","Harley","Lancelot","Fanny","Kagura",
            "Hayabusa","Claude","Karrie","Granger","Bruno","Wanwan","Clint","Lesley","Beatrix","Brody",
            "Esmeralda","Lunox","Harith","Cecilion","Pharsa","Odette","Yve","Valentina","Xavier","Lylia","Benedetta"
        ];
        const PRECO = 3.00;
        const TOTAL = 31;
        
        let numerosConfirmados = [];
        let numerosPendentes = [];
        let numerosSelecionados = [];
        let compradores = {};
        let currentNumber = null;
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<p style="color: ${isError ? '#ff4444' : '#00ff00'}">${msg}</p>`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
        
        function pushToFirebase() {
            dbRef.set({
                numerosSelecionados: numerosSelecionados,
                numerosConfirmados: numerosConfirmados,
                numerosPendentes: numerosPendentes,
                compradores: compradores,
                ultimaAtualizacao: new Date().toISOString()
            }).catch(err => console.error(err));
        }
        
        function listenFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    numerosConfirmados = data.numerosConfirmados || [];
                    numerosPendentes = data.numerosPendentes || [];
                    numerosSelecionados = data.numerosSelecionados || [];
                    compradores = data.compradores || {};
                    updateAll();
                    showToast('🔄 Dados sincronizados!');
                }
            });
        }
        
        function updateStats() {
            document.getElementById('confirmedNumbers').textContent = numerosConfirmados.length;
            document.getElementById('pendingNumbers').textContent = numerosPendentes.length;
            const total = numerosConfirmados.length * PRECO;
            document.getElementById('totalAmount').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }
        
        function updatePendingList() {
            const container = document.getElementById('pendingList');
            if (numerosPendentes.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center;">Nenhum pendente</p>';
                return;
            }
            container.innerHTML = '';
            numerosPendentes.forEach(p => {
                const div = document.createElement('div');
                div.className = 'pending-item';
                div.innerHTML = `
                    <div>
                        <div class="pending-number">Nº ${p.numero} - ${warriorNames[p.numero-1]}</div>
                        <div class="pending-user">👤 ${p.usuario || 'Anônimo'}</div>
                        <div>📅 ${new Date(p.timestamp || p.data).toLocaleString('pt-BR')}</div>
                    </div>
                    <div>
                        <button class="table-btn confirm-btn" onclick="confirmarNumero(${p.numero})">✓ OK</button>
                        <button class="table-btn cancel-btn" onclick="cancelarNumero(${p.numero})">✗ Cancelar</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        function updateNumbersTable() {
            const tbody = document.getElementById('numbersTable');
            tbody.innerHTML = '';
            for (let i = 1; i <= TOTAL; i++) {
                const row = tbody.insertRow();
                let status = 'DISPONÍVEL';
                let statusClass = 'status-available';
                let comprador = '-';
                
                if (numerosConfirmados.includes(i)) {
                    status = 'CONFIRMADO';
                    statusClass = 'status-confirmed';
                    comprador = compradores[i]?.nome || '-';
                } else if (numerosPendentes.some(p => p.numero === i)) {
                    status = 'PENDENTE';
                    statusClass = 'status-pending';
                    const pend = numerosPendentes.find(p => p.numero === i);
                    comprador = pend?.usuario || '-';
                } else if (numerosSelecionados.includes(i)) {
                    status = 'SELECIONADO';
                    statusClass = 'status-sold';
                    comprador = compradores[i]?.nome || '-';
                }
                
                row.innerHTML = `
                    <td style="font-weight:bold;color:#ff4444">${i}</td>
                    <td>${warriorNames[i-1]}</td>
                    <td><span class="status-badge ${statusClass}">${status}</span></td>
                    <td>${comprador}</td>
                `;
            }
        }
        
        function updateNumberInfo() {
            if (!currentNumber) return;
            const infoDiv = document.getElementById('numberInfo');
            document.getElementById('infoNumber').textContent = currentNumber;
            document.getElementById('infoWarrior').textContent = warriorNames[currentNumber-1];
            
            let status = 'DISPONÍVEL';
            if (numerosConfirmados.includes(currentNumber)) status = 'CONFIRMADO';
            else if (numerosPendentes.some(p => p.numero === currentNumber)) status = 'PENDENTE';
            else if (numerosSelecionados.includes(currentNumber)) status = 'SELECIONADO';
            document.getElementById('infoStatus').textContent = status;
            document.getElementById('infoBuyer').textContent = compradores[currentNumber]?.nome || '-';
            infoDiv.style.display = 'block';
            
            const isSelecionado = numerosSelecionados.includes(currentNumber);
            const isConfirmado = numerosConfirmados.includes(currentNumber);
            document.getElementById('confirmNumberBtn').disabled = !isSelecionado || isConfirmado;
            document.getElementById('cancelNumberBtn').disabled = !isSelecionado;
        }
        
        function verificarNumero() {
            const input = document.getElementById('controlNumber');
            const num = parseInt(input.value);
            if (!num || num < 1 || num > TOTAL) {
                showToast('⚠️ Número inválido! Use 1-31', true);
                return;
            }
            currentNumber = num;
            updateNumberInfo();
            input.value = '';
        }
        
        window.confirmarNumero = function(num = currentNumber) {
            if (!num) return;
            if (!numerosSelecionados.includes(num)) {
                showToast(`⚠️ Número ${num} não está selecionado`, true);
                return;
            }
            if (numerosConfirmados.includes(num)) {
                showToast(`⚠️ Número ${num} já está confirmado`, true);
                return;
            }
            numerosConfirmados.push(num);
            numerosPendentes = numerosPendentes.filter(p => p.numero !== num);
            pushToFirebase();
            showToast(`✅ Número ${num} confirmado!`);
            if (currentNumber === num) updateNumberInfo();
        };
        
        window.cancelarNumero = function(num = currentNumber) {
            if (!num) return;
            if (!numerosSelecionados.includes(num)) {
                showToast(`⚠️ Número ${num} não está selecionado`, true);
                return;
            }
            if (!confirm(`Cancelar número ${num}?`)) return;
            numerosSelecionados = numerosSelecionados.filter(n => n !== num);
            numerosConfirmados = numerosConfirmados.filter(n => n !== num);
            numerosPendentes = numerosPendentes.filter(p => p.numero !== num);
            delete compradores[num];
            pushToFirebase();
            showToast(`❌ Número ${num} cancelado`);
            if (currentNumber === num) updateNumberInfo();
        };
        
        function forcarSelecao() {
            let num = currentNumber;
            if (!num) {
                const input = document.getElementById('controlNumber');
                const val = parseInt(input.value);
                if (!val || val < 1 || val > TOTAL) {
                    showToast('⚠️ Digite um número válido primeiro', true);
                    return;
                }
                num = val;
            }
            if (numerosSelecionados.includes(num)) {
                showToast(`⚠️ Número ${num} já está vendido`, true);
                return;
            }
            const nome = prompt(`Nome do comprador para o número ${num} (${warriorNames[num-1]}):`);
            if (!nome || nome.trim() === '') return;
            numerosSelecionados.push(num);
            numerosConfirmados.push(num);
            compradores[num] = { nome: nome.trim(), data: new Date().toISOString(), origem: 'ADM' };
            pushToFirebase();
            showToast(`✅ Número ${num} vendido para ${nome}`);
            if (currentNumber === num) updateNumberInfo();
        }
        
        function updateAll() {
            updateStats();
            updatePendingList();
            updateNumbersTable();
            if (currentNumber) updateNumberInfo();
        }
        
        function setupEvents() {
            document.getElementById('checkNumberBtn').onclick = verificarNumero;
            document.getElementById('controlNumber').onkeypress = (e) => { if(e.key === 'Enter') verificarNumero(); };
            document.getElementById('confirmNumberBtn').onclick = () => confirmarNumero();
            document.getElementById('cancelNumberBtn').onclick = () => cancelarNumero();
            document.getElementById('forceSelectBtn').onclick = forcarSelecao;
        }
        
        function init() {
            setupEvents();
            listenFirebase();
            showToast('🔥 Firebase conectado - Sincronização ativa!');
        }
        
        init();
    </script>
</body>
</html>
